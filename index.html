bsalink<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Brazil Strong Alliance</title>
    <!-- Fonte Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ícones FontAwesome (Versão Corrigida e Estável) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* ========================================================== RESET & VARIÁVEIS GLOBAIS ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            min-height: 100vh;
            background-color: #0b0f17;
            /* Gradientes de fundo para realçar o efeito de vidro */
            background-image: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), 
                              radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%), 
                              radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            color: #f1f5f9;
        }
        /* Container central otimizado para celular */
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* ========================================================== CABEÇALHO / PERFIL ========================================================== */
        .profile {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-wrapper {
            position: relative;
            width: 104px;
            height: 104px;
            margin-bottom: 16px;
        }
        /* Anel gradiente ao redor da foto */
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 50%;
            z-index: 0;
        }
        .avatar-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1e293b;
            border: 3px solid #0b0f17;
            z-index: 1;
        }
        .name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .bio {
            font-size: 0.92rem;
            color: #94a3b8;
            max-width: 320px;
            line-height: 1.45;
        }
        /* ========================================================== LISTA DE BOTÕES ========================================================== */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Estilo base Glassmorphism */
        .btn-link {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.98rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        /* Efeito de hover geral */
        .btn-link:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
        }
        .btn-link:active {
            transform: translateY(-1px);
        }
        .btn-icon {
            font-size: 1.35rem;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 14px;
        }
        .btn-text {
            flex: 1;
            text-align: left;
        }
        .btn-arrow {
            font-size: 0.85rem;
            color: #64748b;
            transition: transform 0.25s ease, color 0.25s ease;
        }
        .btn-link:hover .btn-arrow {
            transform: translateX(4px);
            color: #f8fafc;
        }
        /* Cores personalizadas por plataforma */
        .btn-tiktok .btn-icon {
            color: #25f4ee;
            filter: drop-shadow(0 0 8px rgba(37, 244, 238, 0.5));
        }
        .btn-roblox .btn-icon {
            color: #e11d48;
            filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.4));
        }
        /* Destaque para o Discord */
        .btn-discord {
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.2), rgba(99, 102, 241, 0.1));
            border: 1px solid rgba(88, 101, 242, 0.45);
            box-shadow: 0 4px 22px rgba(88, 101, 242, 0.25);
        }
        .btn-discord:hover {
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.32), rgba(99, 102, 241, 0.18));
            border-color: rgba(88, 101, 242, 0.7);
            box-shadow: 0 8px 30px rgba(88, 101, 242, 0.45);
        }
        .btn-discord .btn-icon {
            color: #5865f2;
            filter: drop-shadow(0 0 8px rgba(88, 101, 242, 0.6));
        }
        .badge-highlight {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #5865f2;
            color: #ffffff;
            padding: 2px 7px;
            border-radius: 6px;
            margin-left: 8px;
            font-weight: 700;
            vertical-align: middle;
        }
        /* Rodapé */
        footer {
            margin-top: 36px;
            font-size: 0.78rem;
            color: #475569;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="container">
        
        <header class="profile">
            <div class="avatar-wrapper">
                <!-- Substitua o src abaixo pela foto oficial do seu servidor (ex: logo.png) -->
                <img class="avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=200&auto=format&fit=crop&q=80" alt="Logo Brazil Strong Alliance">
            </div>
            <h1 class="name">Brazil Strong Alliance</h1>
            <p class="bio">Servidor de Roleplay no Roblox &bull; Criador de conteúdo no TikTok</p>
        </header>

        <nav class="links-list" aria-label="Links úteis">
            <!-- 1. DISCORD -->
            <a href="https://discord.gg/TRdwRux9wq" target="_blank" rel="noopener noreferrer" class="btn-link btn-discord">
                <span class="btn-icon">
                    <i class="fa-brands fa-discord"></i>
                </span>
                <span class="btn-text">Comunidade Discord <span class="badge-highlight">Entre já!</span></span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>

            <!-- 2. ROBLOX -->
            <a href="https://www.roblox.com/pt/games/17797691296/Brazil-Strong-Alliance-Roleplay" target="_blank" rel="noopener noreferrer" class="btn-link btn-roblox">
                <span class="btn-icon">
                    <i class="fa-solid fa-gamepad"></i>
                </span>
                <span class="btn-text">Jogar no Roblox</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>

            <!-- 3. TIKTOK -->
            <a href="https://www.tiktok.com/@administracaobsa?_r=1&_t=ZS-99eIokfibVC" target="_blank" rel="noopener noreferrer" class="btn-link btn-tiktok">
                <span class="btn-icon">
                    <i class="fa-brands fa-tiktok"></i>
                </span>
                <span class="btn-text">Vídeos de RP no TikTok</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>
        </nav>

        <footer>
            &copy; Brazil Strong Alliance &bull; Todos os direitos reservados
        </footer>
        
    </main>
</body>
</html>
